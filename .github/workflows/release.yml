name: Release DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.1.0
        required: true
      build_number:
        description: Build number, defaults to 1
        required: false
        default: '1'
      create_release:
        description: Create a GitHub release after the build
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  release:
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Prepare notary key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$ASC_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
      - name: Build and notarize DMG
        run: |
          ./scripts/build-dmg.sh \
            --version "${{ inputs.version }}" \
            --build-number "${{ inputs.build_number }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"
        env:
          APPLE_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: "$RUNNER_TEMP/notary-key.p8"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hosts-Manager-${{ inputs.version }}-universal
          path: dist/
          if-no-files-found: error
      - name: Create GitHub release
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          gh release create "v${{ inputs.version }}" \
            dist/*.dmg \
            dist/*.sha256 \
            --title "Hosts Manager ${{ inputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
