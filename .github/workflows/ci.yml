name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project hosts-manager.xcodeproj \
            -scheme hosts-manager \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -only-testing:hosts-managerTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Release
        run: |
          xcodebuild build \
            -project hosts-manager.xcodeproj \
            -scheme hosts-manager \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify bundle identifiers and deployment target
        run: |
          plutil -p "build/Build/Products/Release/Hosts Manager.app/Contents/Info.plist" | \
            rg 'personal.hosts-manager|26.0|SUPublicEDKey'
